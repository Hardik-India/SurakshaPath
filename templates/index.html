<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SurakshaPath</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<div id="header">
  <h1><span class="suraksha">Suraksha</span><span class="path">Path</span></h1>
  <p>Predictive Accident Hotspot Detection & Intervention Simulator — Central Kolkata</p>
</div>

<div id="legend">
  <div class="legend-title">Conflict Risk</div>
  <div class="legend-row"><span class="swatch" style="background:#3b82f6"></span> Low</div>
  <div class="legend-row"><span class="swatch" style="background:#22c55e"></span> Moderate-Low</div>
  <div class="legend-row"><span class="swatch" style="background:#eab308"></span> Moderate</div>
  <div class="legend-row"><span class="swatch" style="background:#f97316"></span> High</div>
  <div class="legend-row"><span class="swatch" style="background:#ef4444"></span> Very High</div>
  <div class="legend-divider"></div>
  <div class="legend-title">Tested Junctions</div>
  <div class="legend-row"><span class="dot" style="background:#3fb950"></span> &lt; 60 conflicts</div>
  <div class="legend-row"><span class="dot" style="background:#f0883e"></span> 60–150 conflicts</div>
  <div class="legend-row"><span class="dot" style="background:#f85149"></span> &gt; 150 conflicts</div>
</div>

<div id="map"></div>

<div id="panel" class="hidden">
  <div id="panel-close">&times;</div>
  <h2 id="panel-title">Junction</h2>
  <div id="panel-stats"></div>

  <div id="panel-form">
    <label for="intervention-select">Select Intervention</label>
    <select id="intervention-select">
      <option value="speed_breaker">Speed Breaker</option>
      <option value="signal_retiming">Traffic Signal Retiming</option>
      <option value="other">Other (custom, manual)</option>
    </select>

    <div id="other-input-wrap" class="hidden">
      <input type="text" id="other-input" placeholder="Describe custom intervention..."/>
    </div>

    <button id="add-intervention-btn">Add Intervention</button>
  </div>

  <div id="panel-result"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
